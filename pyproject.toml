[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natoe"
version = "0.1.0"
description = "Dictation -> structured radiology report by template editing (Natoe hiring challenge)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebook = ["notebook>=7.0", "ipykernel>=6.29", "nbformat>=5.9", "nbconvert>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
